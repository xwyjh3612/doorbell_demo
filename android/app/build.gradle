plugins { id 'com.android.application' }
android {
    namespace 'com.youkong.voiceintercom'
    compileSdk 35
    defaultConfig {
        applicationId 'com.youkong.voiceintercom'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '0.10-demo'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        loopback {
            initWith debug
            def slot = providers.gradleProperty('testPhoneSlot').getOrElse('')
            if (!(slot in ['', 'a', 'b'])) throw new GradleException('Unknown testPhoneSlot')
            applicationIdSuffix(slot ? ".fixture.${slot}" : '.fixture')
            matchingFallbacks = ['debug']
        }
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
    testImplementation 'junit:junit:4.13.2'
}
