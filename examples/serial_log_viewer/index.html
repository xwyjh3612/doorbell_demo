<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音对讲 · TTL 实时日志</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#0c1220;color:#e1e8f2}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:25px;margin:0 0 8px}p{color:#8f9eb5;margin:0;font-size:13px}.badge{border:1px solid #274438;background:#142a23;color:#7de6ad;padding:9px 15px;border-radius:30px;font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin:23px 0 15px}.card{background:#141d2c;border:1px solid #243147;border-radius:12px;padding:15px;min-width:0}.label{font-size:12px;color:#93a4bc;margin-bottom:9px}.value{font-size:16px}.path{font-family:Consolas,monospace;font-size:12px;word-break:break-all;line-height:1.5}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}input,select,button,.button{border:1px solid #2b3b54;background:#172235;color:#e1e8f2;border-radius:8px;padding:10px 12px;font:13px "Microsoft YaHei",sans-serif}input{flex:1;min-width:180px}select{max-width:360px}button,.button{cursor:pointer;text-decoration:none;white-space:nowrap}button:hover,.button:hover{border-color:#5a90db}button.primary{background:#255fbd;border-color:#347add}label{font-size:13px;color:#a9b7cb;white-space:nowrap}label input{min-width:0}.logbox{border:1px solid #26344b;border-radius:12px;overflow:hidden;background:#0a101b}.loghead{padding:11px 16px;background:#151f30;color:#91a3bf;font-size:12px;display:flex;justify-content:space-between;gap:12px}#logs{height:calc(100vh - 320px);min-height:300px;overflow:auto;padding:10px 0;font:12px/1.7 Consolas,"Microsoft YaHei",monospace}.line{padding:1px 16px;white-space:pre-wrap;overflow-wrap:anywhere;color:#aebcd0}.line.error{color:#ff9c99;background:#361d2340}.line.warn{color:#e8c585}.line.call{color:#89b8ff;background:#172b4740}.line.network{color:#92dacb}.empty{padding:30px;color:#7f91ab}footer{font-size:12px;color:#7c8da6;margin-top:12px;line-height:1.7}#message{color:#ffbc87;margin-bottom:10px;font-size:13px}@media(max-width:750px){main{padding:16px}.cards{grid-template-columns:1fr 1fr}.card:last-child{grid-column:span 2}header{align-items:flex-start}.badge{white-space:nowrap;font-size:11px}#logs{height:55vh}select{max-width:100%;flex:1}h1{font-size:21px}}
</style>
<main>
<header><div><h1>TTL 实时日志</h1><p>语音对讲设备 · 查看完整串口输出与通话过程</p></div><span class="badge" id="status">正在连接</span></header>
<section class="cards">
<div class="card"><div class="label">日志最后写入</div><div class="value" id="updated">—</div></div>
<div class="card"><div class="label">已保存到电脑</div><div class="value" id="size">—</div></div>
<div class="card"><div class="label">当前日志文件</div><div class="path" id="path">正在寻找采集目录…</div></div>
</section>
<div id="message" role="status"></div>
<div class="toolbar">
<select id="source" aria-label="日志来源"><option value="live">实时 · 当前设备采集</option></select>
<select id="filter" aria-label="日志分类"><option value="all">全部输出</option><option value="call">通话过程</option><option value="network">4G / MQTT 网络</option><option value="error">错误与警告</option></select>
<input id="search" placeholder="搜索文字，例如：bye、断开、Send A" aria-label="搜索日志">
<button class="primary" id="pause">暂停查看</button>
<label><input type="checkbox" id="scroll" checked> 自动滚动</label>
<label><input type="checkbox" id="raw"> 显示雷达原始数据</label>
<label><input type="checkbox" id="radar"> 显示雷达摘要</label>
<label><input type="checkbox" id="details"> 详细调试输出</label>
<button id="clear">清空日志</button><button id="copy">复制可见日志</button><a class="button" href="/api/download">下载完整日志</a>
</div>
<div class="logbox"><div class="loghead"><span id="count">准备读取日志</span><span id="mode">实时刷新 · 0.5 秒</span></div><div id="logs" role="log" aria-label="串口日志"></div></div>
<footer>日志由电脑上的串口采集程序持续写入，关闭网页或暂停查看不会停止保存。“清空日志”清空当前显示，已保存文件仍可下载。界面显示最近 4,000 行。仅本机访问。</footer>
</main>
<script>
const $=id=>document.getElementById(id),patterns={call:/DOOR_BELL:|webrtc:|DTLS:|AGENT:|PEER_DEF:|AUD_SRC:|Received message type: (offer|answer|bye|ring|reject|timeout)|Offer cached|Received bye|CALL_RING/,network:/network_4g:|AtModem:|AtUart:|Ml307Mqtt:|Ml307Udp:|MQTT_SIG:/,error:/\b[EW] \(\d+\)|Failed|Fail to|Guru Meditation|Brownout|abort\(\)|panic/i};
let lines=[],last=0,epoch=-1,paused=false,frozen=[],visible=[],renderPending=false;
function filtered(data){const kind=$('filter').value,query=$('search').value.toLowerCase(),noise=/MQTT_SIG: MQTT SUB|webrtc: Send A:|PEER_DEF: Send \d|AGENT:.*send indication bind (?:request|response)|unhandled MQTT event: puback|(?:ICE信息保存|ICE server:|ICE URL:|ICE User:|ICE PSW:|Got ICE:)/i;return data.filter(l=>($('raw').checked||!/RADAR_GPIO5: (?:[0-9a-f]{2}\s+)*[0-9a-f]{2}\s*$/i.test(l.text))&&($('radar').checked||!/RADAR_GPIO5: (?:STATUS|HISTORY)|RADAR_TELEMETRY: published|^\S+ (?:radar history|esp>\s*)$/.test(l.text))&&($('details').checked||!noise.test(l.text)||patterns.error.test(l.text))&&(kind==='all'||patterns[kind].test(l.text))&&(!query||l.text.toLowerCase().includes(query)));}
function render(){renderPending=false;visible=filtered(paused?frozen:lines);const area=$('logs'),atBottom=area.scrollHeight-area.scrollTop-area.clientHeight<50,oldTop=area.scrollTop;const fragment=document.createDocumentFragment();for(const row of visible){const div=document.createElement('div');div.className='line';if(/\bE \(\d+\)|Guru Meditation|Brownout|abort\(\)/.test(row.text))div.classList.add('error');else if(/\bW \(\d+\)/.test(row.text))div.classList.add('warn');else if(patterns.call.test(row.text))div.classList.add('call');else if(patterns.network.test(row.text))div.classList.add('network');div.textContent=row.text||' ';fragment.append(div);}if(!visible.length){const div=document.createElement('div');div.className='empty';div.textContent=lines.length?'没有匹配的日志，试试修改筛选条件。':'等待设备输出…';fragment.append(div);}area.replaceChildren(fragment);$('count').textContent=`显示 ${visible.length.toLocaleString()} 行 / 最近 ${(paused?frozen:lines).length.toLocaleString()} 行`;if(!paused&&$('scroll').checked&&(atBottom||oldTop===0))area.scrollTop=area.scrollHeight;else area.scrollTop=oldTop;}
function schedule(){if(!renderPending){renderPending=true;requestAnimationFrame(render);}}
async function poll(){try{const response=await fetch(`/api/state?after=${last}&epoch=${epoch}`);if(!response.ok)throw Error('日志服务未响应');const state=await response.json();if(state.reset){lines=[];epoch=state.epoch;}lines.push(...state.lines);if(lines.length>4000)lines=lines.slice(-4000);last=state.last_id;$('path').textContent=state.path||'等待采集日志';$('size').textContent=state.bytes>=1e6?(state.bytes/1e6).toFixed(2)+' MB':(state.bytes/1000).toFixed(1)+' KB';$('updated').textContent=state.modified?new Date(state.modified).toLocaleTimeString('zh-CN'):'—';const age=state.modified?(Date.now()-Date.parse(state.modified))/1000:Infinity;$('status').textContent=state.selection==='live'?(age<10?'采集中 · 已保存':'等待新输出'):'历史记录';$('message').textContent=age>10&&state.selection==='live'?'当前没有新输出，请检查设备供电与串口连接；已有日志已保存。':'';$('mode').textContent=paused?'查看已暂停 · 后台继续保存':state.note;if(!paused&&(state.reset||state.lines.length))schedule();}catch(error){$('status').textContent='服务连接中断';$('message').textContent=error.message+'，双击桌面“TTL实时日志”重新打开。';}finally{setTimeout(poll,500);}}
async function refreshSources(){try{const data=await(await fetch('/api/sources')).json(),selected=$('source').value;const option=document.createElement('option');option.value='live';option.textContent='实时 · 当前设备采集';const options=[option,...data.sources.map(source=>{const o=document.createElement('option');o.value=source;o.textContent='历史 · '+source.replace('/console.log','');return o;})];$('source').replaceChildren(...options);$('source').value=[...$('source').options].some(o=>o.value===selected)?selected:'live';}catch{}setTimeout(refreshSources,15000);}
$('source').onchange=async()=>{try{const response=await fetch('/api/source',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:$('source').value})});if(!response.ok)throw Error('切换日志失败');paused=false;frozen=[];$('pause').textContent='暂停查看';}catch(e){$('message').textContent=e.message;}};
$('pause').onclick=()=>{paused=!paused;if(paused)frozen=lines.slice();else frozen=[];$('pause').textContent=paused?'继续实时查看':'暂停查看';schedule();};
$('clear').onclick=()=>{lines=[];frozen=[];schedule();$('clear').textContent='已清空显示';setTimeout(()=>$('clear').textContent='清空日志',1500);};
$('filter').onchange=schedule;$('search').oninput=schedule;$('raw').onchange=schedule;$('radar').onchange=schedule;$('details').onchange=schedule;$('scroll').onchange=()=>{if($('scroll').checked&&!paused)$('logs').scrollTop=$('logs').scrollHeight;};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(visible.map(l=>l.text).join('\n'));$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制可见日志',1500);}catch{$('message').textContent='复制失败，可以下载完整日志。';}};
render();refreshSources();poll();
</script>
</html>
